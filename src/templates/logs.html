{% extends "layout.html" %}

{% block title %}Logs - Autotitrator{% endblock %}
{% block heading %}System Logs{% endblock %}

{% block head %}
<style>
    .log-controls {
        display: flex;
        gap: 1rem;
        margin-bottom: 1rem;
        align-items: center;
        flex-wrap: wrap;
    }

    .log-container {
        background: #1a1a2e;
        border-radius: var(--radius-md);
        padding: 1rem;
        font-family: 'Monaco', 'Consolas', monospace;
        font-size: 0.85rem;
        max-height: 600px;
        overflow-y: auto;
    }

    .log-entry {
        padding: 0.4rem 0.6rem;
        border-bottom: 1px solid #2a2a3e;
        display: grid;
        grid-template-columns: 150px 70px 1fr;
        gap: 1rem;
    }

    .log-entry:hover {
        background: rgba(255, 255, 255, 0.05);
    }

    .log-timestamp {
        color: #888;
    }

    .log-level {
        font-weight: 600;
        text-transform: uppercase;
    }

    .log-level.INFO { color: #4ade80; }
    .log-level.WARNING { color: #fbbf24; }
    .log-level.ERROR { color: #f87171; }
    .log-level.DEBUG { color: #60a5fa; }

    .log-message {
        color: #e2e8f0;
        word-break: break-word;
    }

    .auto-refresh-toggle {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .no-logs {
        color: #888;
        text-align: center;
        padding: 2rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2 class="card-title">Live Log Viewer</h2>
    </div>

    <div class="log-controls">
        <select id="levelFilter" class="form-input" style="width: auto;">
            <option value="">All Levels</option>
            <option value="INFO">INFO</option>
            <option value="WARNING">WARNING</option>
            <option value="ERROR">ERROR</option>
        </select>

        <label class="auto-refresh-toggle">
            <input type="checkbox" id="autoRefresh" checked>
            <span>Auto-refresh (5s)</span>
        </label>

        <button class="btn btn-outline" onclick="fetchLogs()">Refresh Now</button>
    </div>

    <div class="log-container" id="logContainer">
        <div class="no-logs">Loading logs...</div>
    </div>
</div>

<script>
    let autoRefreshInterval = null;

    async function fetchLogs() {
        const levelFilter = document.getElementById('levelFilter').value;
        const container = document.getElementById('logContainer');

        try {
            const url = levelFilter 
                ? `/api/logs?level=${levelFilter}&limit=200` 
                : '/api/logs?limit=200';
            const res = await fetch(url);
            const logs = await res.json();

            if (logs.length === 0) {
                container.innerHTML = '<div class="no-logs">No logs found</div>';
                return;
            }

            container.innerHTML = logs.map(log => `
                <div class="log-entry">
                    <span class="log-timestamp">${log.timestamp}</span>
                    <span class="log-level ${log.level}">${log.level}</span>
                    <span class="log-message">${escapeHtml(log.message)}</span>
                </div>
            `).join('');

        } catch (e) {
            container.innerHTML = '<div class="no-logs">Error loading logs</div>';
            console.error('Failed to fetch logs:', e);
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function toggleAutoRefresh() {
        const enabled = document.getElementById('autoRefresh').checked;
        if (enabled && !autoRefreshInterval) {
            autoRefreshInterval = setInterval(fetchLogs, 5000);
        } else if (!enabled && autoRefreshInterval) {
            clearInterval(autoRefreshInterval);
            autoRefreshInterval = null;
        }
    }

    // Event listeners
    document.getElementById('levelFilter').addEventListener('change', fetchLogs);
    document.getElementById('autoRefresh').addEventListener('change', toggleAutoRefresh);

    // Initial load
    fetchLogs();
    toggleAutoRefresh();
</script>
{% endblock %}
